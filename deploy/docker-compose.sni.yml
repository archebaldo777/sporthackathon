# Стенд на сервере, где порт 443 уже занят другим сервисом: подключается поверх docker-compose.yml и docker-compose.prod.yml.
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml -f deploy/docker-compose.sni.yml up -d --build
# HAProxy на хосте (deploy/haproxy-sni.cfg) разводит 443 по имени: домены стенда — в Caddy (127.0.0.1:8444), остальное — прежнему сервису.
services:
  caddy:
    ports: !override
      - "80:80"
      - "127.0.0.1:8444:443"
    environment:
      ACME_WEBROOT_SITES: ${ACME_WEBROOT_SITES:-http://acme.invalid}
    volumes: !override
      - ./deploy/Caddyfile.sni:/etc/caddy/Caddyfile:ro
      - /var/www/acme:/srv/acme:ro
      - caddy-data:/data
      - caddy-config:/config

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prebuilt
