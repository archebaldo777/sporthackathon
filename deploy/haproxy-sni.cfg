# HAProxy для режима «порт 443 общий»: стенд «Драфт» и уже работающий на сервере TLS-сервис (например, VPN ocserv)
# на одном порту. Подключение разбирается по имени из TLS ClientHello (SNI) без расшифровки: домены стенда — в Caddy,
# всё остальное (другие домены и подключения по IP) — прежнему сервису. Оба получают реальный IP клиента (PROXY v2).
# Запуск — отдельным контейнером в сети хоста (не зависит от стека стенда, поднимается после перезагрузки):
#   docker run -d --name sni-proxy --network host --restart always --user root \
#     -e DRAFT_SNI_SUFFIX=.46-29-164-196.sslip.io -e DRAFT_SNI_DOMAIN=sporthackathon.ru -e EXISTING_TLS_BACKEND=127.0.0.1:4443 \
#     -v $PWD/deploy/haproxy-sni.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro haproxy:2.8-alpine
# DRAFT_SNI_DOMAIN — собственный домен стенда (сам домен и все его поддомены); обе переменные обязательны.
# Прежний сервис переносится на внутренний порт и принимает PROXY protocol (для ocserv: tcp-port = 4443, listen-proxy-proto = true).
global
	log stdout format raw local0
	maxconn 4096

defaults
	mode tcp
	log global
	option dontlognull
	timeout connect 5s
	timeout client 1h
	timeout server 1h
	timeout tunnel 24h

frontend tls_443
	bind :::443 v4v6
	tcp-request inspect-delay 5s
	tcp-request content accept if { req_ssl_hello_type 1 }
	use_backend draft if { req_ssl_sni -i -m end "${DRAFT_SNI_SUFFIX}" "${DRAFT_SNI_DOMAIN}" }
	default_backend existing

backend draft
	server caddy 127.0.0.1:8444 send-proxy-v2

backend existing
	server svc "${EXISTING_TLS_BACKEND}" send-proxy-v2
